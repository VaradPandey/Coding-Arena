services:
  # 1. Backend API & WebSockets Gateway
  - type: web
    name: codearena-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,https://coding-arena.vercel.app
      - key: JUDGE_WORKER_URL
        value: https://codearena-judge-worker.onrender.com

  # 2. Judge Worker Sandbox (Docker Container with g++ & test suites)
  - type: web
    name: codearena-judge-worker
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PORT
        value: 10000
      - key: WORKER_PORT
        value: 10000
